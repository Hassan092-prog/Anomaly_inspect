[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-inspect"
version = "0.1.0"
description = "Open-world visual anomaly detection benchmark, confidence-guided fusion, and inspection platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["research*", "backend*"]
exclude = ["research.tests*", "backend.tests*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["research", "backend", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["research/tests", "backend/tests", "tests"]
addopts = "-ra"
markers = [
    "slow: marks tests requiring real models, GPUs, or datasets (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
